services:
  # Backend API (Django)
  - type: web
    name: opus-api
    runtime: python
    plan: free
    buildCommand: "cd backend && ./build.sh"
    startCommand: "cd backend && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: opus_db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "opus-api.onrender.com,opus-app.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://opus-app.onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://opus-app.onrender.com"
      - key: USE_POSTGRES
        value: "True"

  # Frontend (Vite/React) as a static site
  - type: web
    name: opus-app
    runtime: static
    plan: free
    buildCommand: "cd frontend && npm ci && npm run build"
    staticPublishPath: "frontend/dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        value: "https://opus-api.onrender.com"
